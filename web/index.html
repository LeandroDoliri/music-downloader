<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="logo" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <div>
                <h1>Music Downloader</h1>
                <p>Pega un enlace de YouTube o Spotify</p>
            </div>
        </header>

        <!-- Avisos de dependencias: actualizaciones disponibles, ffmpeg/deno faltantes -->
        <div class="banner" id="env-banner" hidden>
            <div class="banner-text">
                <strong id="env-title"></strong>
                <span id="env-detail"></span>
            </div>
            <button type="button" class="banner-btn" id="btn-update" hidden>
                <div class="spinner" hidden></div>
                <span>Actualizar</span>
            </button>
        </div>

        <div class="field">
            <label for="url">Enlace</label>
            <div class="url-wrap">
                <input type="text" id="url" placeholder="https://..." autocomplete="off" spellcheck="false">
                <span class="source-badge" id="source-badge"></span>
            </div>
        </div>

        <div class="field">
            <span class="field-label">Tipo</span>
            <div class="segmented" id="format" role="radiogroup" aria-label="Tipo de descarga">
                <button type="button" role="radio" data-value="mp3" aria-checked="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    Audio
                </button>
                <button type="button" role="radio" data-value="mp4" aria-checked="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3z"/></svg>
                    Video
                </button>
            </div>
            <p class="hint" id="format-hint" hidden>spotDL solo descarga audio.</p>
        </div>

        <div class="field">
            <span class="field-label">Carpeta destino</span>
            <button type="button" id="btn-folder" class="folder-picker">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="folder-path" id="folder-path">Ninguna carpeta seleccionada</span>
                <span class="folder-action" id="folder-action">Elegir</span>
            </button>
        </div>

        <!-- Opciones Avanzadas -->
        <div class="accordion">
            <button class="accordion-header" id="btn-advanced" type="button" aria-expanded="false" aria-controls="advanced-panel">
                <span>Opciones avanzadas</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="accordion-content" id="advanced-panel">
                <div class="accordion-inner">
                    <div class="adv-grid">
                        <div class="field">
                            <label for="adv-format">Formato</label>
                            <select id="adv-format"></select>
                        </div>
                        <div class="field">
                            <label for="adv-quality">Calidad</label>
                            <select id="adv-quality"></select>
                        </div>
                    </div>
                    <p class="hint adv-hint" id="adv-hint" hidden></p>
                    <div class="checkbox-group">
                        <label class="checkbox-label" id="lbl-playlist">
                            <input type="checkbox" id="chk-playlist">
                            <span class="checkmark"></span>
                            <span>Bajar la playlist entera <small>(si el enlace es de un video dentro de una playlist)</small></span>
                        </label>
                        <label class="checkbox-label" id="lbl-metadata">
                            <input type="checkbox" id="chk-metadata" checked>
                            <span class="checkmark"></span>
                            <span>Incrustar metadatos y portada <small id="metadata-note" hidden>(spotDL siempre los incluye)</small></span>
                        </label>
                        <label class="checkbox-label" id="lbl-subs" hidden>
                            <input type="checkbox" id="chk-subs">
                            <span class="checkmark"></span>
                            <span>Incrustar subtítulos <small>(español e inglés)</small></span>
                        </label>
                        <label class="checkbox-label" id="lbl-sponsor" hidden>
                            <input type="checkbox" id="chk-sponsor">
                            <span class="checkmark"></span>
                            <span>Quitar partes sin música <small>(intros, diálogos · SponsorBlock)</small></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="btn-download" class="btn-primary" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>
                <span>Descargar</span>
            </button>
            <button id="btn-cancel" class="btn-danger" type="button" hidden>
                <div class="spinner"></div>
                <span>Cancelar</span>
            </button>
        </div>

        <section class="status" id="status" hidden>
            <div class="status-row">
                <span class="status-text" id="status-text">Preparando…</span>
                <span class="status-percent" id="status-percent"></span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <details class="log">
                <summary>Ver registro</summary>
                <div class="console" id="console"></div>
            </details>
        </section>

        <footer class="footer">
            <span id="versions">Comprobando versiones…</span>
            <button type="button" class="link-btn" id="btn-check">Buscar actualizaciones</button>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
